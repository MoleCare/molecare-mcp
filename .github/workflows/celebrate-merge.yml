name: Celebrate merge
on:
  pull_request_target:
    types: [closed]
permissions:
  pull-requests: write
jobs:
  celebrate:
    if: github.event.pull_request.merged && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - uses: YauhenBichel/merge-cheer@714c61072d0b5326deb8f334911d466ee33e2bb3 # v1.9.0
        with:
          model: gpt-4o-mini
          model-api-key: ${{ secrets.OPENAI_API_KEY }}
