name: Celebrate merge

# After a human pull request merges, comment with a celebrating GIF.
#
# Prefers a G-rated Giphy GIF when GIPHY_API_KEY is set
# (https://developers.giphy.com/dashboard). Without a key it falls back to the
# Party Parrot copies in MoleCare/.github, which need no configuration.
# Tenor's public API is gone (June 2026); do not call it.
#
# The GIFs are referenced by URL rather than committed here on purpose: this
# repository refuses binary images in CI, and that rule is not worth relaxing
# for a party parrot. See MoleCare/.github -> celebrate/NOTICE.
#
# pull_request_target so merges from forks can be commented on. It must NOT
# check out the pull request head — that would run fork code with a writable
# token.

on:
  pull_request_target:
    types: [closed]

permissions:
  pull-requests: write

jobs:
  celebrate:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - name: Pick a G-rated GIF
        id: gif
        env:
          GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          title = os.environ.get("PR_TITLE", "").lower()
          key = os.environ.get("GIPHY_API_KEY", "").strip()

          if any(w in title for w in ("fix", "bug", "hotfix", "patch")):
              tag, slug = "nailed it", "nailed-it"
          elif any(w in title for w in ("feat", "add ", "added", "new ")):
              tag, slug = "ship it", "ship-it"
          elif any(w in title for w in ("doc", "readme")):
              tag, slug = "nice work", "nice-work"
          elif any(w in title for w in ("test", "ci")):
              tag, slug = "high five", "high-five"
          elif any(w in title for w in ("refactor", "clean")):
              tag, slug = "cleanup", "cleanup"
          else:
              tag, slug = "celebration", "celebration"

          url = ""
          if key:
              qs = urllib.parse.urlencode({"api_key": key, "tag": tag, "rating": "g"})
              req = urllib.request.Request(
                  f"https://api.giphy.com/v1/gifs/random?{qs}",
                  headers={"User-Agent": "molecare-celebrate-merge"},
              )
              try:
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      data = json.load(resp)
                  images = (data.get("data") or {}).get("images") or {}
                  url = (
                      (images.get("downsized") or {}).get("url")
                      or (images.get("original") or {}).get("url")
                      or ""
                  )
              except Exception as exc:
                  print(f"giphy skipped: {exc}")

          if not url:
              url = (
                  "https://raw.githubusercontent.com/MoleCare/.github/main"
                  f"/celebrate/{slug}.gif"
              )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"url={url}\n")
              fh.write(f"tag={tag}\n")
          PY

      - uses: actions/github-script@v9
        env:
          GIF_URL: ${{ steps.gif.outputs.url }}
          GIF_TAG: ${{ steps.gif.outputs.tag }}
        with:
          script: |
            const login = context.payload.pull_request.user.login;
            const gif = process.env.GIF_URL || "";
            const tag = process.env.GIF_TAG || "celebration";
            let body = `Merged — thank you @${login}.\n`;
            if (gif) {
              body += `\n![${tag}](${gif})\n`;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
