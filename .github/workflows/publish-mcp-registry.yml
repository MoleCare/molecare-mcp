name: Publish to MCP Registry

# Publishes server.json to registry.modelcontextprotocol.io.
#
# Authentication is GitHub Actions OIDC rather than a personal login, so the
# io.github.MoleCare/* namespace is proven by the workflow running inside the
# MoleCare org. No token is stored, and publishing does not depend on any one
# person's account.
#
# npm must be published first — the registry verifies that the version declared
# in server.json exists on npm and carries a matching mcpName field.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for OIDC

    steps:
      - uses: actions/checkout@v7

      - name: Install mcp-publisher
        run: |
          curl -sSL \
            "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/
          mcp-publisher --help > /dev/null

      - name: Validate server.json
        run: mcp-publisher validate

      - name: Check the declared version exists on npm
        run: |
          VERSION=$(node -p "require('./server.json').packages[0].version")
          PKG=$(node -p "require('./server.json').packages[0].identifier")
          echo "Checking $PKG@$VERSION"
          npm view "$PKG@$VERSION" version
          PUBLISHED_MCP_NAME=$(npm view "$PKG@$VERSION" mcpName)
          EXPECTED=$(node -p "require('./server.json').name")
          if [ "$PUBLISHED_MCP_NAME" != "$EXPECTED" ]; then
            echo "mcpName mismatch: npm has '$PUBLISHED_MCP_NAME', server.json declares '$EXPECTED'"
            exit 1
          fi

      - name: Authenticate via OIDC
        run: mcp-publisher login github-oidc

      - name: Publish
        run: mcp-publisher publish

  verify:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      # The registry can accept a publish while still exposing stale metadata.
      # Verify the public entry and the npm tarball after the write completes.
      - name: Verify the published registry listing
        run: node scripts/verify-registry-listing.mjs
