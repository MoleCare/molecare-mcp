name: Bug report
description: Something in the MCP server does not work as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Do not attach real skin photos or patient data.**
        If this is a security vulnerability, email info@molecare.co.uk instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what did you get instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. npm run build
        2. Call tool `get_system_health` with ...
        3. See error
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Were you running in mock mode?
      description: Mock mode means no MOLECARE_API_URL / AWS credentials configured.
      options:
        - "Yes — mock mode (no credentials set)"
        - "No — pointed at my own backend"
        - "Not sure"
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node version
      placeholder: "v20.11.0"
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: MCP client
      placeholder: "Claude Desktop 1.x / Cursor / MCP Inspector"
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact any keys, hostnames, or user identifiers.
      render: shell
