name: Feature request
description: Propose a new tool, resource, or capability
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before proposing medical functionality, please read the clinical-safety
        section of [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md). Tools that
        move toward diagnosis or triage will be declined.
  - type: textarea
    id: problem
    attributes:
      label: What can't you do today?
      description: Describe the gap, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you add?
      description: Tool name, inputs, and what the response would contain.
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Dermatology knowledge (educational)
        - MoleCare API client
        - MLOps / operations tooling
        - Developer experience / docs
        - Other
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Clinical safety
      options:
        - label: This does not produce, imply, or imitate a diagnosis or triage decision
          required: true
        - label: This works in mock mode with no credentials configured
          required: true
